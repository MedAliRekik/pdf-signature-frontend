<div class="page">
  <div class="card">
    <h1>Signature PDF</h1>
    <p>Importe un PDF, ajoute une signature générée à partir de ton nom, puis télécharge le document signé.</p>

    <div class="form-group">
      <label>Fichier PDF</label>
      <input type="file" accept="application/pdf" (change)="onFileSelected($event)" />
    </div>

    <div class="form-group">
      <label>Nom du signataire</label>
      <input type="text" [(ngModel)]="signerName" placeholder="Ex: Mohamed Ali Rekik" />
    </div>

    <div class="form-group">
      <label>Texte optionnel</label>
      <input type="text" [(ngModel)]="additionalText" placeholder="Ex: Bon pour accord" />
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Page</label>
        <input type="number" [(ngModel)]="pageNumber" min="1" />
      </div>

      <div class="form-group">
        <label>Position X</label>
        <input type="number" [(ngModel)]="x" min="0" />
      </div>

      <div class="form-group">
        <label>Position Y</label>
        <input type="number" [(ngModel)]="y" min="0" />
      </div>
    </div>

    <button type="button" (click)="signPdf()" [disabled]="isLoading">
      {{ isLoading ? 'Signature en cours...' : 'Signer et télécharger' }}
    </button>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>
</div>
