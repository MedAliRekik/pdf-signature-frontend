<mat-card class="preview-card" *ngIf="file; else emptyState">
  <div class="preview-scroll" #previewContainer>
    <div class="page-block" *ngFor="let page of renderedPages">
      <div class="page-label">Page {{ page.pageNumber }}</div>
      <div class="canvas-wrapper" [id]="page.boundaryId" [attr.data-page-number]="page.pageNumber">
        <canvas #canvas></canvas>
        <app-draggable-signature
          *ngFor="let signature of getSignaturePage(page.pageNumber)"
          [id]="signature.id"
          [x]="signature.displayX"
          [y]="signature.displayY"
          [signerName]="signature.signerName || signerName"
          [boundarySelector]="'.preview-scroll'"
          (positionChange)="onSignatureMove($event)"
          (remove)="signatureRemoved.emit($event)"
        />
      </div>
    </div>
  </div>

  <div class="loading" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Chargement du PDF…</span>
  </div>
</mat-card>

<ng-template #emptyState>
  <mat-card class="empty">Importez un PDF pour afficher la prévisualisation complète.</mat-card>
</ng-template>
