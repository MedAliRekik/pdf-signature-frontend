<mat-card class="preview-card" *ngIf="file; else emptyState">
  <div class="preview-scroll">
    <div class="page-block" *ngFor="let page of renderedPages">
      <div class="page-label">Page {{ page.pageNumber }}</div>
      <div class="canvas-wrapper">
        <canvas #canvas></canvas>
        <app-draggable-signature
          *ngIf="signaturePosition.pageNumber === page.pageNumber"
          [x]="signaturePosition.x"
          [y]="page.height - signaturePosition.y"
          [signerName]="signerName"
          (positionChange)="onSignatureMove($event, page)"
        />
      </div>
    </div>
  </div>
</mat-card>
<ng-template #emptyState><mat-card class="empty">Importez un PDF pour afficher la prévisualisation complète.</mat-card></ng-template>
