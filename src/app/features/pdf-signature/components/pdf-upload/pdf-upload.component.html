<mat-card>
  <h3>1) Importer votre PDF</h3>
  <p>Traitement temporaire du document · Aucun stockage applicatif prévu.</p>
  <button mat-stroked-button color="primary" type="button" (click)="fileInput.click()">
    <mat-icon>upload_file</mat-icon>
    Choisir un fichier PDF
  </button>
  <input #fileInput hidden type="file" accept="application/pdf" (change)="onFileChange($event)" />
</mat-card>
