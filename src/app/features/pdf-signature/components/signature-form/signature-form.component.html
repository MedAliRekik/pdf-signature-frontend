<mat-card>
  <h3>Informations de signature</h3>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="w-100"><mat-label>Nom du signataire</mat-label><input matInput formControlName="signerName" (input)="emitSignerName()"/></mat-form-field>
    <mat-form-field appearance="outline" class="w-100"><mat-label>Texte additionnel</mat-label><input matInput formControlName="additionalText" (input)="emitAdditionalText()"/></mat-form-field>
  </form>
</mat-card>
