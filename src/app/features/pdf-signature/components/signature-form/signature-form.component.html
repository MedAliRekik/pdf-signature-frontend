<div class="card">
  <h3>Informations de signature</h3>
  <form [formGroup]="form">
    <label>Nom du signataire</label>
    <input formControlName="signerName" (input)="emitSignerName()" placeholder="Ex: Jean Dupont" />
    <label>Texte additionnel</label>
    <input formControlName="additionalText" (input)="emitAdditionalText()" placeholder="Bon pour accord" />
  </form>
</div>
